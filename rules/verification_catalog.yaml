- id: ERR_IMAGE_PARTIAL_001
  pattern_id: P-IMAGE-PARTIAL-REUSE
  category: Warning [画像重複・再利用（要出典確認）]
  description: 回転・クロップ・コントラスト変更など変形後も、部分領域の画像特徴が閾値以上で一致し、出典が無い。
  status: implemented
  priority: P0
  target:
  - images
  - legend_citation_flags
  - panel_map
  severity: Warning
  taxonomy:
  - A2
  source_kinds:
  - curated_pubpeer
  - literature
  - retraction_watch_crossref
  not_sufficient:
  - 出典が明示された意図的再掲
- id: ERR_BLOT_LANE_001
  pattern_id: P-BLOT-LANE-REUSE
  category: Warning [画像重複・再利用（要出典確認）]
  description: ゲル／ウェスタン等でレーン帯または loading control 領域が別実験パネルと閾値以上で一致し、正当な再表示の明示が無い。
  status: implemented
  priority: P0
  target:
  - images
  - blot_lane_regions
  - legend_citation_flags
  severity: Warning
  taxonomy:
  - A3
  source_kinds:
  - literature
  - retraction_watch_crossref
  not_sufficient:
  - 同一ゲルの正当な再表示＋明示
- id: ERR_VECTOR_SUBSET_001
  pattern_id: P-VECTOR-SUBSET-UNDISCLOSED
  category: Warning [コントロール群共有]
  description: 他パネルの点列の真部分集合（端点欠落・外れ値削除など）なのに、独立実験と読める記述で共有が明示されない。
  status: implemented
  priority: P0
  target:
  - table_vectors
  - figure_panels
  - manuscript_claims
  severity: Warning
  taxonomy:
  - B2
  source_kinds:
  - check_reference
  - curated_pubpeer
  not_sufficient:
  - 本文が shared control を明示
- id: ERR_ERRORBAR_001
  pattern_id: P-ERRORBAR-SEM-SD-MISMATCH
  category: Warning [実験データとの不一致]
  description: Legend／本文の誤差棒種別（SEM/SD/CI）と、生データから再計算した誤差が許容範囲外で矛盾する。
  status: implemented
  priority: P1
  target:
  - legend_error_bar_type
  - tables
  - legend_stats
  severity: Warning
  taxonomy:
  - D3
  source_kinds:
  - literature
  not_sufficient:
  - error_bar_type 未抽出のみ
- id: ERR_MULTIPLICITY_001
  pattern_id: P-STAT-MULTIPLICITY-GAP
  category: Warning [統計手法の不整合]
  description: 群数が 3 以上なのに多重比較補正なしの対比較 t 検定など、群構造と適用検定が矛盾する。
  status: implemented
  priority: P1
  target:
  - tables
  - legend_methods
  - group_counts
  severity: Warning
  taxonomy:
  - D1
  source_kinds:
  - cope_case_database
  - literature
  not_sufficient:
  - 群数不明
- id: ERR_NUMERIC_XREF_001
  pattern_id: P-NUMERIC-CROSSREF-MISMATCH
  category: Warning [実験データとの不一致]
  description: Results／Legend の mean・p・n 等の数値が、表または Fig 由来の対応数値と許容誤差外で不一致。
  status: implemented
  priority: P0
  target:
  - manuscript_numeric_claims
  - tables
  - legend_stats
  severity: Warning
  taxonomy:
  - C2
  - D3
  source_kinds:
  - literature
  not_sufficient:
  - 丸め差のみ
- id: ERR_SCALE_MAG_001
  pattern_id: P-SCALE-MAG-INCONSISTENT
  category: Warning [設定・アノテーション不整合]
  description: 画像特徴が同一または実質同一なのに、倍率・スケールバー記載が矛盾する。
  status: implemented
  priority: P2
  target:
  - images
  - legend_magnification
  - scale_bar_meta
  severity: Warning
  taxonomy:
  - A2
  - E2
  source_kinds:
  - literature
  not_sufficient:
  - 画像非同一
- id: ERR_COUNT_N_001
  pattern_id: P-COUNT-N-MISMATCH
  category: Warning [サンプルサイズ記載誤記]
  description: フローサイトメトリー・コロニー等のカウント表の有効 n と Legend 記載 n が一致しない（既存 n 系エンジンへの寄せも可）。
  status: implemented
  priority: P2
  target:
  - count_tables
  - legend_n
  severity: Warning
  taxonomy:
  - C2
  source_kinds:
  - literature
  - check_reference
  not_sufficient:
  - カウント表が無い
- id: ERR_SOURCE_DUP_001
  pattern_id: P-SOURCE-DUPLICATE-VALUES
  category: Warning [データ取り違え]
  description: 独立サンプル／別条件と読めるソースデータ内で、測定値が厳密に同一（または不自然な丸め桁の一致）が、測定分解能から期待される頻度を超えて現れる。
  status: implemented
  priority: P0
  target:
  - source_tables
  - figure_panels
  - independence_claims
  severity: Warning
  taxonomy:
  - F1
  source_kinds:
  - check_reference
  - curated_pubpeer
  not_sufficient:
  - 離散カウントで一致が自然に起きうる場合
  - 機器分解能の説明のみ（有罪断定しない）
- id: ERR_SOURCE_RATIO_001
  pattern_id: P-SOURCE-RATIO-ARTIFACT
  category: Warning [データ取り違え]
  description: 別条件・別遺伝子・独立実験と読める測定値のあいだで、比が正確に整数（2/3/10/100 
    等）に揃う、小数部だけが群横断で一致する、または棒＋誤差棒が定数倍で同一形状になる。
  status: implemented
  priority: P0
  target:
  - source_tables
  - figure_panels
  - legend_stats
  severity: Warning
  taxonomy:
  - F2
  source_kinds:
  - check_reference
  - curated_pubpeer
  not_sufficient:
  - ΔΔCt 等で単発の 2 倍が出るだけ（Methods と整合し頻度が低い）
- id: ERR_DERIVED_PRECISION_001
  pattern_id: P-DERIVED-VALUE-PRECISION
  category: Warning [有効桁・数値表示]
  description: ソース表の値が小さい分母の分数を循環小数のまま切った形（1/3→0.3333 等）や、測定精度を超える桁の計算値（qPCR 
    ソフト出力の正規化値等）で並び、「有効桁数を超えている」と指摘されうる。本文に比・正規化の記載があれば降格し、なければ Methods への明記または表示桁の丸めを促す。
  status: implemented
  priority: P2
  target:
  - source_tables
  - legend_methods
  severity: Warning
  taxonomy:
  - F2
  source_kinds:
  - curated_pubpeer
  not_sufficient:
  - 比・正規化値であること自体は問題ではない（科学的には無害なことが多い）
  - Methods に比・正規化・ΔΔCt の算出が明記されている
- id: ERR_SURVIVAL_N_001
  pattern_id: P-SURVIVAL-COUNT-NONINTEGER
  category: Warning [サンプルサイズ記載誤記]
  description: Methods／Legend がバイアルあたり固定個体数 N を謳うのに、生存率×N から復元した生存個体数が非整数になる時点がある。
  status: implemented
  priority: P1
  target:
  - survival_tables
  - vial_or_cohort_size
  - legend_methods
  severity: Warning
  taxonomy:
  - F3
  - C2
  source_kinds:
  - check_reference
  - curated_pubpeer
  not_sufficient:
  - Methods が「約 N」と明示
  - '丸め誤差のみ（例: 0.999→1）'
- id: ERR_METHODS_CLAIM_001
  pattern_id: P-METHODS-CLAIM-MISMATCH
  category: Warning [設定・アノテーション不整合]
  description: Methods／本文の定量的主張（結合比・サンプリング範囲・モデル名・n／再現の有無など）が、図・Extended Data・表メタと許容範囲外で矛盾する。
  status: implemented
  priority: P0
  target:
  - methods_claims
  - figure_meta
  - tables
  severity: Warning
  taxonomy:
  - E3
  source_kinds:
  - check_reference
  - curated_pubpeer
  not_sufficient:
  - 主張スパーン未抽出
- id: ERR_EXCLUSION_001
  pattern_id: P-EXCLUSION-UNDECLARED
  category: Warning [サンプルサイズ記載誤記]
  description: Methods／Legend の記載 n よりソース表の有効個体・行が多く、除外基準の明示が無い。除外後の再計算（生存曲線・検定）が記載結果と食い違う場合も含む。
  status: implemented
  priority: P0
  target:
  - source_tables
  - legend_n
  - exclusion_criteria
  - legend_stats
  severity: Warning
  taxonomy:
  - C3
  source_kinds:
  - check_reference
  - ori_case_summaries
  - cope_case_database
  - curated_pubpeer
  not_sufficient:
  - 除外基準が Methods に明示され除外 ID がトレース可能
- id: ERR_REF_MISSING_001
  pattern_id: P-REF-MISSING-ENTRY
  category: Warning [表記揺れ・参照不整合]
  description: 本文の引用キー（番号／author–year）に対応する References エントリが無い。
  status: implemented
  priority: P1
  target:
