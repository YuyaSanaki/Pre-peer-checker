schema_version: '1.0'
canonical_store: fixtures/patterns/pubpeer_patterns.json
note: この YAML は人間可読ビュー。実行時は JSON 正本を読む。編集する場合は JSON を更新してから export し直すか、propose の提案をレビューして JSON に 
  merge する。
catalog_policy:
  sources:
  - retraction_watch_crossref
  - ori_case_summaries
  - cope_case_database
  - literature
  - curated_pubpeer
  - check_reference
  - benchmark
  absolute_rules:
  - 'no_verbatim_expression: コメント原文・長い引用・PDF/図の再配布（git/Issue/PR/配布物）をしない'
  - 'abstract_to_inspection_spec: abstract_rule / pattern_id / Warning タグのみ。有罪断定・告発文は入れない'
  - 'no_commenter_targeting: コメント者の名指し・攻撃をしない。カタログは方法論'
  forbidden:
  - pubpeer_automated_scrape
  - guilt_score_ml
  - verbatim_comment_corpora
  - retracted_paper_figures_in_git
  - pdf_or_comment_text_in_git_issue_pr
  - naming_or_attacking_commenters_in_catalog
  rule_store: fixtures/patterns/pubpeer_patterns.json
  taxonomy: DETECTION_AND_MODELS.md §2.0.1 (A–F)
  ethics_canonical: DETECTION_AND_MODELS.md カタログ倫理の絶対ルール
  catalog_revision: ethics-absolute-rules 2026-09-24
rules:
- id: ERR_DATA_MISMATCH_001
  pattern_id: P-DATA-SWAP-CROSS-CONDITION
  category: Warning [データ取り違え]
  description: ラベル上は別実験・別条件のパネル／群なのに、プロット数値ベクトル（または作図に渡った DF）が同一または実質同一。
  status: implemented
  priority: P0
  target:
  - table_vectors
  - code_dag
  - figure_panels
  severity: Warning
  taxonomy:
  - B1
  source_kinds:
  - benchmark
  - check_reference
  - cope_case_database
  - ori_case_summaries
  not_sufficient:
  - 結果の方向性が同じであることだけの類似
- id: ERR_SAMPLE_SIZE_001
  pattern_id: P-N-MISMATCH-LEGEND-VS-DATA
  category: Warning [サンプルサイズ記載誤記]
  description: Figure Legend / 本文の n と、生データ有効行数（またはスクリプト入力 n）が一致しない。
  status: implemented
  priority: P0
  target:
  - legend_n
  - table_nrows
  severity: Warning
  taxonomy:
  - C1
  source_kinds:
  - benchmark
  - check_reference
  - cope_case_database
  - literature
  not_sufficient:
  - ggplot geom_point の可視ドット数
- id: ERR_SAMPLE_SIZE_002
  pattern_id: P-N-INCONSISTENT-ACROSS-IDENTICAL-PLOTS
  category: Warning [サンプルサイズ記載誤記]
  description: 点列が同一なのにパネル間で Legend n が異なる。
  status: implemented
  priority:
  target:
  - figure_panels
  - legend_n
  severity: Warning
  taxonomy:
  - C2
  source_kinds:
  - benchmark
  - check_reference
  not_sufficient: []
- id: ERR_IMAGE_REUSE_001
  pattern_id: P-IMAGE-REUSE-UNCITED
  category: Warning [画像重複・再利用（要出典確認）]
  description: 同一論文内またはユーザー指定の過去論文コーパスと画像特徴が閾値以上で一致し、Legend に出典が無い。
  status: implemented
  priority: P0
  target:
  - images
  - legend_citation_flags
  severity: Warning
  taxonomy:
  - A1
  - A4
  source_kinds:
  - check_reference
