  description: 群構造と適用検定（多重比較の有無、対応の有無）またはスクリプトと本文の検定名が矛盾。
  status: implemented
  priority: P1
  target:
  - tables
  - code
  - legend_methods
  severity: Warning
  taxonomy:
  - D1
  - D2
  source_kinds:
  - benchmark
  - literature
  not_sufficient: []
- id: ERR_CONFIG_001
  pattern_id: P-CONFIG-ANNOTATION-MISMATCH
  category: Warning [設定・アノテーション不整合]
  description: YAML/設定の群・n と実 DF・Word 条件名が不一致。
  status: implemented
  priority:
