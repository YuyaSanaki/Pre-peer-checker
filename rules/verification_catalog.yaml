  severity: Warning
  taxonomy:
  - E4
  source_kinds:
  - literature
  not_sufficient: []
- id: ERR_REF_META_001
  pattern_id: P-REF-META-INCONSISTENT
  category: Warning [表記揺れ・参照不整合]
  description: 同一参考文献エントリ内で年・DOI・著者／タイトルの明らかな自己矛盾または必須メタ欠落。
  status: implemented
