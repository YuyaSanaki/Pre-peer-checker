  source_kinds:
  - literature
  not_sufficient: []
- id: ERR_REF_DUP_001
  pattern_id: P-REF-DUPLICATE-KEY
  category: Warning [表記揺れ・参照不整合]
  description: References で同一番号／同一キーが重複している。
  status: implemented
  priority: P1
  target:
