- id: ERR_SHARED_CTRL_001
  pattern_id: P-SHARED-CONTROL-UNDISCLOSED
  category: Warning [コントロール群共有]
  description: 複数パネルでコントロール（または同一 genotype）の点列が完全一致／高重複／端点欠落の部分集合。本文が独立実験に読める場合は明示共有の記載が無ければ 
    Warning。
  status: implemented
  priority: P1
  target:
  - table_vectors
  - figure_panels
  - manuscript_claims
  severity: Warning
  taxonomy:
  - B2
  source_kinds:
  - check_reference
  - cope_case_database
  - curated_pubpeer
  - ori_case_summaries
  not_sufficient: []
- id: ERR_STATS_RECALC_001
  pattern_id: P-STATS-RECALC-MISMATCH
  category: Warning [実験データとの不一致]
  description: 生データから再計算した記述統計・p が Legend/本文と許容誤差外で不一致。
  status: implemented
  priority: P0
  target:
  - tables
  - legend_stats
  severity: Warning
  taxonomy:
  - D3
  source_kinds:
  - benchmark
  - cope_case_database
  - literature
  - check_reference
