  - literature
  not_sufficient: []
- id: ERR_REF_PDF_META_001
  pattern_id: P-REF-PDF-META-MISMATCH
  category: Warning [表記揺れ・参照不整合]
  description: 参考文献メタ（DOI／年／タイトル）がユーザー提供の引用先 PDF メタと決定論的に食い違う。
