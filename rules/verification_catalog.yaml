  target:
  - references
  severity: Warning
  taxonomy:
  - E4
  source_kinds:
  - literature
  not_sufficient: []
- id: ERR_REF_ORPHAN_001
  pattern_id: P-REF-ORPHAN-ENTRY
  category: Warning [表記揺れ・参照不整合]
  description: References にあるが本文で一度も引用されていない（初期は coverage note／情報寄り）。
  status: implemented
  priority: P2
  target:
  - manuscript
  - references
  severity: Warning
